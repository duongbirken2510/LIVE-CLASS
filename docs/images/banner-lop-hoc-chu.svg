<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e5631"/>
      <stop offset="100%" stop-color="#13381f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bgGrad)"/>

  <!-- Decorative glowing orbs -->
  <circle cx="150" cy="80" r="140" fill="#22c55e" opacity="0.1"/>
  <circle cx="1050" cy="300" r="180" fill="#eab308" opacity="0.12"/>

  <!-- Main Blackboard Frame -->
  <rect x="48" y="34" width="1104" height="312" rx="18" fill="#8b5a2b" stroke="#fde047" stroke-width="3" filter="url(#shadow)"/>
  <rect x="62" y="48" width="1076" height="284" rx="12" fill="url(#boardGrad)" stroke="#14532d" stroke-width="2"/>

  <!-- Top Ribbon -->
  <rect x="370" y="20" width="460" height="38" rx="19" fill="#dc2626" stroke="#fde047" stroke-width="2.5"/>
  <text x="600" y="45" text-anchor="middle" fill="#fef08a" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="1.5">🎓 TIKTOK LIVE INTERACTIVE GAME SHOW · 1080×1920</text>

  <!-- Main Title -->
  <text x="600" y="135" text-anchor="middle" fill="url(#goldGrad)" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="56" letter-spacing="2">🏫 LIVE-CLASS — LỚP HỌC TƯƠNG TÁC</text>
  <text x="600" y="176" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="21" opacity="0.95">Cô Ngân &amp; Thầy Minh giảng bài · 25 Giọng AI VieNeu-TTS · 4 Cấp Học · 34 Chủ Đề (2,500+ Câu Đố)</text>

  <!-- 4 Stage Badges inside Blackboard -->
  <g transform="translate(95, 206)">
    <rect x="0" y="0" width="235" height="92" rx="12" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    <text x="117" y="28" text-anchor="middle" fill="#86efac" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15">🌱 KỲ 1 · CẤP 1 (Câu 1–5)</text>
    <text x="117" y="52" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">Bảng Xanh · Bàn Gỗ Vàng</text>
    <text x="117" y="74" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">🧣 Khăn Quàng Đỏ · Áo Dài Trắng</text>
  </g>

  <g transform="translate(348, 206)">
    <rect x="0" y="0" width="235" height="92" rx="12" fill="#0f3d3e" stroke="#67e8f9" stroke-width="2"/>
    <text x="117" y="28" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15">⚡ KỲ 2 · CẤP 2 (Câu 6–10)</text>
    <text x="117" y="52" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">Bảng Từ Lam · Bàn Gỗ Óc Chó</text>
    <text x="117" y="74" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">🎽 Cổ Áo Đoàn Xanh · Sơ Mi</text>
  </g>

  <g transform="translate(601, 206)">
    <rect x="0" y="0" width="235" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="117" y="28" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15">🔥 KỲ 3 · CẤP 3 (Câu 11–15)</text>
    <text x="117" y="52" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">Bảng Đá Đen · Bàn Gỗ Đỏ Gụ</text>
    <text x="117" y="74" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">🎗️ Băng Đô Quyết Thắng · Áo Dài Ngọc</text>
  </g>

  <g transform="translate(854, 206)">
    <rect x="0" y="0" width="250" height="92" rx="12" fill="#450a0a" stroke="#fde047" stroke-width="2.5"/>
    <text x="125" y="28" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15">👑 KỲ 4 · TÚ TÀI (Câu 16–20)</text>
    <text x="125" y="52" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">Bảng Sơn Mài Đỏ · Bàn Thảm Đỏ</text>
    <text x="125" y="74" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13">🌿 Vòng Nguyệt Quế Vàng &amp; Mũ 🎓</text>
  </g>

  <!-- Chalk Tray -->
  <rect x="380" y="324" width="440" height="12" rx="4" fill="#a16207"/>
  <rect x="440" y="318" width="28" height="6" rx="2" fill="#ffffff"/>
  <rect x="480" y="318" width="28" height="6" rx="2" fill="#fde047"/>
  <rect x="520" y="318" width="28" height="6" rx="2" fill="#f87171"/>
  <rect x="720" y="315" width="42" height="9" rx="3" fill="#eab308"/>
</svg>
