<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390">
  <defs>
    <linearGradient id="sunsetBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31102f"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="22" fill="url(#sunsetBg)"/>

  <!-- Confetti & Sparkles -->
  <circle cx="90" cy="60" r="6" fill="#fde047"/>
  <circle cx="180" cy="310" r="8" fill="#f472b6"/>
  <circle cx="1090" cy="80" r="7" fill="#38bdf8"/>
  <circle cx="1040" cy="320" r="9" fill="#4ade80"/>
  <text x="80" y="180" font-size="40">🎉</text>
  <text x="1080" y="200" font-size="40">🎊</text>

  <!-- Main Goodbye Card -->
  <g transform="translate(130, 26)" filter="url(#glow)">
    <rect width="940" height="338" rx="24" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="4"/>
    <rect x="260" y="-14" width="420" height="38" rx="19" fill="#dc2626" stroke="#fde047" stroke-width="2.5"/>
    <text x="470" y="11" text-anchor="middle" fill="#fef08a" font-family="Segoe UI, sans-serif" font-weight="900" font-size="16">🔔 TÙNG! TÙNG! TÙNG! · LỄ TỔNG KẾT TAN TRƯỜNG</text>

    <text x="470" y="62" text-anchor="middle" fill="#9a3412" font-family="Segoe UI, sans-serif" font-weight="900" font-size="30">👋 HẸN GẶP LẠI CẢ LỚP Ở CA HỌC TIẾP THEO!</text>
    <text x="470" y="88" text-anchor="middle" fill="#b45309" font-family="Segoe UI, sans-serif" font-weight="700" font-size="15">Cô Ngân / Thầy Minh cùng 30 học sinh đồng loạt vẫy tay chào &amp; đọc tên vinh danh Top 3 xuất sắc nhất</text>

    <!-- Top 3 Podium -->
    <g transform="translate(65, 108)">
      <!-- Top 2 -->
      <rect x="0" y="22" width="245" height="96" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
      <text x="122" y="52" text-anchor="middle" fill="#475569" font-family="Segoe UI, sans-serif" font-weight="900" font-size="17">🥈 Á QUÂN · HẠNG 2</text>
      <text x="122" y="78" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, sans-serif" font-weight="800" font-size="16">booun.ie_</text>
      <text x="122" y="102" text-anchor="middle" fill="#0284c7" font-family="Segoe UI, sans-serif" font-weight="900" font-size="14">145 điểm · Lớp 6</text>

      <!-- Top 1 -->
      <rect x="268" y="6" width="274" height="112" rx="16" fill="#fef08a" stroke="#eab308" stroke-width="3"/>
      <text x="405" y="38" text-anchor="middle" fill="#b45309" font-family="Segoe UI, sans-serif" font-weight="900" font-size="19">👑 QUÁN QUÂN · HẠNG 1</text>
      <text x="405" y="68" text-anchor="middle" fill="#78350f" font-family="Segoe UI, sans-serif" font-weight="900" font-size="19">Phước Thiên</text>
      <text x="405" y="96" text-anchor="middle" fill="#dc2626" font-family="Segoe UI, sans-serif" font-weight="900" font-size="15">180 điểm · Tốt Nghiệp 🎓</text>

      <!-- Top 3 -->
      <rect x="565" y="22" width="245" height="96" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
      <text x="687" y="52" text-anchor="middle" fill="#c2410c" font-family="Segoe UI, sans-serif" font-weight="900" font-size="17">🥉 QUÝ QUÂN · HẠNG 3</text>
      <text x="687" y="78" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, sans-serif" font-weight="800" font-size="16">Lý Thảo Lan</text>
      <text x="687" y="102" text-anchor="middle" fill="#ea580c" font-family="Segoe UI, sans-serif" font-weight="900" font-size="14">120 điểm · Lớp 5</text>
    </g>

    <!-- Follow CTA Banner -->
    <g transform="translate(65, 242)">
      <rect width="810" height="72" rx="16" fill="#dc2626" stroke="#fde047" stroke-width="3"/>
      <text x="405" y="31" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="900" font-size="18">➕ BẤM FOLLOW KÊNH &amp; BẬT CHUÔNG THÔNG BÁO 🔔 NGAY HÔM NAY!</text>
      <text x="405" y="55" text-anchor="middle" fill="#fef08a" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14">Học bạ từ Lớp 1 → Lớp 12 được lưu trọn đời · Nhận thông báo tự động ngay khi Thầy Cô mở lớp mới!</text>
    </g>
  </g>
</svg>
